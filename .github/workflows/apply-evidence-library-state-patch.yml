name: Apply evidence library state patch

on:
  push:
    paths:
      - evidence-library-state-patch.json
      - .github/workflows/apply-evidence-library-state-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CSV row updates
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          payload = json.loads(Path('evidence-library-state-patch.json').read_text())
          for update in payload.get('updates', []):
              path = Path(update['path'])
              key_column = update['key_column']
              key = str(update['key'])
              with path.open(newline='', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  fields = reader.fieldnames
                  rows = list(reader)
              if not fields or key_column not in fields:
                  raise RuntimeError(f'Invalid key column {key_column!r} for {path}')
              matches = [r for r in rows if r.get(key_column) == key]
              if len(matches) != 1:
                  raise RuntimeError(f'Expected exactly one {key_column}={key!r} row in {path}; found {len(matches)}')
              row = matches[0]
              for col, value in update.get('set', {}).items():
                  if col not in fields:
                      raise RuntimeError(f'Unknown column {col!r} for {path}')
                  row[col] = str(value)
              with path.open('w', newline='', encoding='utf-8') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  writer.writeheader()
                  writer.writerows(rows)
          PY
      - name: Commit state updates
        run: |
          git config user.name "evidence-library-engine"
          git config user.email "actions@users.noreply.github.com"
          git add political-violence-media/historical-backfill/COVERAGE.csv channel14-factcheck/backfill/COVERAGE.csv leadership-accountability/backfill/COVERAGE.csv
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update coordinated evidence library coverage state"
            git pull --rebase origin main
            git push
          fi
