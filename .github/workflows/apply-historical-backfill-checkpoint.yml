name: Apply historical backfill checkpoint

on:
  push:
    paths:
      - 'political-violence-media/historical-backfill/checkpoints/*.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply checkpoint
        shell: bash
        run: |
          set -euo pipefail
          checkpoint=$(git diff --name-only HEAD^ HEAD | grep '^political-violence-media/historical-backfill/checkpoints/.*\.json$' | tail -1)
          test -n "$checkpoint"
          python - "$checkpoint" <<'PY'
          import csv, io, json, sys
          from pathlib import Path

          cp = json.loads(Path(sys.argv[1]).read_text())
          candidate_path = Path(cp['candidate_path'])
          fields = cp['candidate_fields']
          existing = candidate_path.read_text(encoding='utf-8')
          existing_ids = {line.split(',', 1)[0] for line in existing.splitlines() if line.startswith('JAN')}
          appends = cp.get('candidate_appends', [])
          for row in appends:
              if row['candidate_id'] in existing_ids:
                  raise SystemExit(f"Duplicate candidate {row['candidate_id']}")
          if appends:
              out = io.StringIO(newline='')
              w = csv.DictWriter(out, fieldnames=fields, lineterminator='\n')
              for row in appends:
                  w.writerow({k: row.get(k, '') for k in fields})
              with candidate_path.open('a', encoding='utf-8', newline='') as f:
                  if existing and not existing.endswith('\n'):
                      f.write('\n')
                  f.write(out.getvalue())

          coverage_path = Path(cp['coverage_path'])
          with coverage_path.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              cov_fields = reader.fieldnames
              cov = list(reader)
          found = False
          for row in cov:
              if row['period'] == cp['period']:
                  row.update(cp['coverage_update']); found = True; break
          if not found:
              raise SystemExit(f"Coverage period not found: {cp['period']}")
          with coverage_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=cov_fields)
              w.writeheader(); w.writerows(cov)
          PY
      - name: Commit state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add political-violence-media/historical-backfill/candidates political-violence-media/historical-backfill/COVERAGE.csv
          git diff --cached --quiet || git commit -m 'Update historical backfill state'
          git push
