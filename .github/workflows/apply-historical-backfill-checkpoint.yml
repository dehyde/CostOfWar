name: Apply historical backfill checkpoint

on:
  push:
    paths:
      - 'political-violence-media/historical-backfill/checkpoints/*.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply checkpoint
        shell: bash
        run: |
          set -euo pipefail
          checkpoint=$(git diff --name-only HEAD^ HEAD | grep '^political-violence-media/historical-backfill/checkpoints/.*\.json$' | tail -1)
          test -n "$checkpoint"
          python - "$checkpoint" <<'PY'
          import csv, json, sys
          from pathlib import Path

          cp = json.loads(Path(sys.argv[1]).read_text())
          candidate_path = Path(cp['candidate_path'])
          with candidate_path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys()) if rows else cp['candidate_fields']
          by_id = {r['candidate_id']: r for r in rows}
          for patch in cp.get('candidate_updates', []):
              if patch['candidate_id'] not in by_id:
                  raise SystemExit(f"Unknown candidate {patch['candidate_id']}")
              by_id[patch['candidate_id']].update(patch)
          for row in cp.get('candidate_appends', []):
              if row['candidate_id'] in by_id:
                  raise SystemExit(f"Duplicate candidate {row['candidate_id']}")
              normalized = {k: row.get(k, '') for k in fields}
              rows.append(normalized)
              by_id[normalized['candidate_id']] = normalized
          with candidate_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)

          coverage_path = Path(cp['coverage_path'])
          with coverage_path.open(newline='', encoding='utf-8') as f:
              cov = list(csv.DictReader(f)); cov_fields = list(cov[0].keys())
          found = False
          for row in cov:
              if row['period'] == cp['period']:
                  row.update(cp['coverage_update']); found = True; break
          if not found:
              raise SystemExit(f"Coverage period not found: {cp['period']}")
          with coverage_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=cov_fields)
              w.writeheader(); w.writerows(cov)
          PY
      - name: Commit state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add political-violence-media/historical-backfill/candidates political-violence-media/historical-backfill/COVERAGE.csv
          git diff --cached --quiet || git commit -m 'Update historical backfill state'
          git push
