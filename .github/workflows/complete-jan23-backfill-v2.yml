name: Complete January 2023 historical backfill v2
on:
  push:
    paths:
      - '.github/workflows/complete-jan23-backfill-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair legacy CSV row and run state patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          candidate = Path('political-violence-media/historical-backfill/candidates/2023-01.csv')
          text = candidate.read_text(encoding='utf-8-sig')
          old = "JAN23-131,2023-01-29,Beit Furik checkpoint,Palestinians — West Bank,Settlers stoned Palestinian vehicles and damaged two.,SRC-2023-0203,Accepted,ILPV-2023-0126,NAD monthly names two owners; daily reporting has a variant owner/count, so conservative identity is retained.,No exact media yet"
          new = 'JAN23-131,2023-01-29,Beit Furik checkpoint,Palestinians — West Bank,Settlers stoned Palestinian vehicles and damaged two.,SRC-2023-0203,Accepted,ILPV-2023-0126,"NAD monthly names two owners; daily reporting has a variant owner/count, so conservative identity is retained.",No exact media yet'
          assert old in text, 'Expected malformed JAN23-131 row not found'
          candidate.write_text(text.replace(old, new), encoding='utf-8')

          wf = Path('.github/workflows/complete-jan23-backfill.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          block = wf.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(block), {})
          PY

          git config user.name "historical-backfill-bot"
          git config user.email "actions@users.noreply.github.com"
          git add political-violence-media/historical-backfill/candidates/2023-01.csv political-violence-media/historical-backfill/COVERAGE.csv
          git rm .github/workflows/complete-jan23-backfill.yml .github/workflows/diagnose-jan23-csv.yml .github/workflows/complete-jan23-backfill-v2.yml
          git commit -m "Complete January 2023 historical backfill [skip ci]"
          git push
