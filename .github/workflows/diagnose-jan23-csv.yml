name: Diagnose January candidate CSV
on:
  push:
    paths:
      - '.github/workflows/diagnose-jan23-csv.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import csv
          p='political-violence-media/historical-backfill/candidates/2023-01.csv'
          with open(p,newline='',encoding='utf-8-sig') as f:
              r=csv.DictReader(f)
              for row in r:
                  if None in row:
                      print('BAD',row.get('candidate_id'),repr(row.get(None)),repr(row))
          PY
