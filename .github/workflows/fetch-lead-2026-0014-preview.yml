name: Fetch LEAD-2026-0014 preview

on:
  push:
    paths:
      - 'leadership-accountability/preview-trigger-lead-2026-0014-direct.txt'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p leadership-accountability/previews
          curl -fL --retry 2 --connect-timeout 10 --max-time 45 \
            'https://media.news1.co.il/UploadImages/NEWSY2049e4a1beb36d4b2587b02cc42dcd1c86.jpg' \
            -o leadership-accountability/previews/LEADMED-2026-0011.jpg
          test -s leadership-accountability/previews/LEADMED-2026-0011.jpg
      - name: Commit preview
        shell: bash
        run: |
          git config user.name 'media-preview-bot'
          git config user.email 'media-preview-bot@users.noreply.github.com'
          git add leadership-accountability/previews/LEADMED-2026-0011.jpg
          if git diff --cached --quiet; then
            echo 'No preview changes'
          else
            git commit -m 'Fetch exact LEAD-2026-0014 preview'
            git pull --rebase origin main
            git push
          fi
