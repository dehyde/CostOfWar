name: Complete January 2023 historical backfill

on:
  push:
    paths:
      - '.github/workflows/complete-jan23-backfill.yml'

permissions:
  contents: write

jobs:
  patch-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch January candidate and coverage state
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from collections import Counter

          candidate_path = Path('political-violence-media/historical-backfill/candidates/2023-01.csv')
          coverage_path = Path('political-violence-media/historical-backfill/COVERAGE.csv')

          with candidate_path.open(newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)

          by_id = {r['candidate_id']: r for r in rows}
          for cid, note in {
              'JAN23-100': 'Resolved work package: residual Nablus/Qalqiliya/Salfit events were unitized or explicitly left unresolved/rejected; accepted event rows now extend through ILPV-2023-0213.',
              'JAN23-101': 'Resolved work package: residual Bethlehem/Hebron events were unitized or explicitly left unresolved/rejected; accepted event rows now extend through ILPV-2023-0226.',
              'JAN23-102': 'Resolved work package: earlier West Bank residuals were checked against the canonical dataset; remaining vague/out-of-scope records were explicitly unresolved or rejected rather than invented.',
          }.items():
              by_id[cid]['status'] = 'Merged'
              by_id[cid]['resolution_notes'] = note
              by_id[cid]['media_status'] = 'Residual exact-media gaps retained; no substitute imagery used'

          def row(cid, date, location, target, summary, sources, status, incident_id='', notes='', media='No exact media yet'):
              return {
                  'candidate_id': cid, 'date': date, 'location': location, 'target': target,
                  'summary': summary, 'discovery_sources': sources, 'status': status,
                  'incident_id': incident_id, 'resolution_notes': notes, 'media_status': media,
              }

          new_rows = [
              row('JAN23-201','2023-01-01','Kafr al-Dik','Palestinians — West Bank','Settlers destroyed an agricultural room owned by Iyad Ismail Othman Ali Ahmed.','SRC-2023-0279','Accepted','ILPV-2023-0196','Detailed dated NAD monitoring; independent incident-level corroboration not recovered.'),
              row('JAN23-202','2023-01-06','Qarawat Bani Hassan','Palestinians — West Bank','Settlers fired indiscriminately toward Palestinian residents; no casualties specified.','SRC-2023-0280','Accepted','ILPV-2023-0197','Detailed NAD event-level monitoring; politics limited to explicit settler attribution.'),
              row('JAN23-203','2023-01-09',"Za'atara checkpoint area",'Palestinians — West Bank','Settlers stoned and damaged Munawar Tayseer Odeh’s vehicle.','SRC-2023-0281','Accepted','ILPV-2023-0198','Named-owner NAD event-level monitoring.'),
              row('JAN23-204','2023-01-13','Kafr al-Dik','Palestinians — West Bank','Settlers destroyed a second agricultural room, owned by Ahmed Muhammad Ali Ahmed.','SRC-2023-0282','Accepted','ILPV-2023-0199','Distinct dated event from the Jan. 1 room destruction.'),
              row('JAN23-205','2023-01-19','Iskaka bridge','Palestinians — West Bank','Settlers threw stones at Palestinian vehicles; no injuries or specific damage reported.','SRC-2023-0283','Accepted','ILPV-2023-0200','Detailed NAD event-level monitoring.'),
              row('JAN23-206','2023-01-27','Deir Sharaf junction','Palestinians — West Bank','Settlers attacked a Palestinian vehicle on the Nablus–Tulkarm road.','SRC-2023-0284','Accepted','ILPV-2023-0201','Method/damage not specified; incident coding kept conservative.'),
              row('JAN23-207','2023-01-28','Yatma entrance','Palestinians — West Bank','Settlers fired indiscriminately, beat and stoned Mahmoud Khalifa Sanubar.','SRC-2023-0285','Accepted','ILPV-2023-0202','Named-victim NAD daily/monthly record; injury severity not established.'),
              row('JAN23-208','2023-01-28','Qusra outskirts','Palestinians — West Bank','Settlers fired indiscriminately and attacked Amjad Hassan’s home.','SRC-2023-0286','Accepted','ILPV-2023-0203','Named-home NAD event; casualty/damage count not specified.'),
              row('JAN23-209','2023-01-28','Al-Nasaria area','Palestinians — West Bank','Settlers assaulted Mahdi Qassem Muhammad Abu Adwan and Sanad Mahmoud Faraj.','SRC-2023-0287','Accepted','ILPV-2023-0204','Two named victims; injury severity not specified.'),
              row('JAN23-210','2023-01-28','Burin village bridge','Palestinians — West Bank','Settlers stoned passing Palestinian vehicles.','SRC-2023-0288','Accepted','ILPV-2023-0205','NAD event-level monitoring; no injury/damage specified.'),
              row('JAN23-211','2023-01-28','Jalud chicken-farm area','Palestinians — West Bank','Monitoring says settlers attacked chicken farms during the Jan. 28 wave, but the exact act/damage cannot be separated safely from other Jalud events.','NAD January daily/monthly','Unresolved','','Insufficient event detail to create a distinct incident without over-splitting the Jalud attack cluster.',''),
              row('JAN23-212','2023-01-28','Huwwara','Palestinians — West Bank','Settlers smashed the windows of Al-Shani Supermarket.','SRC-2023-0289','Accepted','ILPV-2023-0206','Distinct property-damage subincident in NAD daily monitoring.'),
              row('JAN23-213','2023-01-29','Yitzhar settlement junction','Palestinians — West Bank','Settlers stoned and damaged Samer Musleh Hammad’s vehicle.','SRC-2023-0290','Accepted','ILPV-2023-0207','Named-owner NAD event.'),
              row('JAN23-214','2023-01-30','Al-Masoudia near Burqa','Palestinians — West Bank','Settlers damaged Sa’ed Desouki’s fence, water tanks and agricultural equipment.','SRC-2023-0291','Accepted','ILPV-2023-0208','Named-owner NAD event with specific property damage.'),
              row('JAN23-215','2023-01-31','Deir Sharaf junction','Palestinians — West Bank','Settlers threw stones at Palestinian vehicles just after midnight.','SRC-2023-0292','Accepted','ILPV-2023-0209','Timed NAD event; no injury/damage specified.'),
              row('JAN23-216','2023-01-30','Izbat al-Tabib junction','Palestinians — West Bank','A settler fired indiscriminately toward residents after alleged stone throwing.','SRC-2023-0293','Accepted','ILPV-2023-0210','Timed NAD event; no casualties reported.'),
              row('JAN23-217','2023-01-28','Yasuf entrance','Palestinians — West Bank','Settlers threw stones at Palestinian vehicles.','SRC-2023-0294','Accepted','ILPV-2023-0211','NAD event-level monitoring.'),
              row('JAN23-218','2023-01-29','Yasuf entrance','Palestinians — West Bank','Settlers again threw stones at Palestinian vehicles the next day.','SRC-2023-0295','Accepted','ILPV-2023-0212','Distinct next-day NAD event.'),
              row('JAN23-219','2023-01-28','Wadi Qana road','Palestinians — West Bank','Settlers threw stones at passing Palestinian vehicles.','SRC-2023-0296','Accepted','ILPV-2023-0213','NAD event-level monitoring.'),
              row('JAN23-220','2023-01-27','Etzion junction','Palestinians — West Bank','Settlers attacked Palestinian vehicles on the Bethlehem–Hebron road and damaged several.','SRC-2023-0297','Accepted','ILPV-2023-0214','NAD event-level monitoring; property damage explicit.'),
              row('JAN23-221','2023-01-28',"Tequ'a entrance",'Palestinians — West Bank','Settlers threw stones at Palestinian vehicles.','SRC-2023-0298','Accepted','ILPV-2023-0215','NAD event-level monitoring.'),
              row('JAN23-222','2023-01-28','Husan entrance','Palestinians — West Bank','Settlers threw stones at Palestinian vehicles.','SRC-2023-0299','Accepted','ILPV-2023-0216','NAD event-level monitoring.'),
              row('JAN23-223','2023-01-29','Beit Iskariya','Palestinians — West Bank','Settlers stormed Beit Iskariya and attacked Palestinian homes.','SRC-2023-0300','Accepted','ILPV-2023-0217','Explicit Jan. 29 event; kept distinct from Jan. 28 Samar Shaheen assault.'),
              row('JAN23-224','2023-01-30',"East of Tuqu'",'Palestinians — West Bank','Armed settlers bulldozing a settlement road on Hamid-family land opened fire toward residents.','SRC-2023-0301','Accepted','ILPV-2023-0218','NAD explicitly describes gunfire and private-land damage.'),
              row('JAN23-225','2023-01-27',"Sada al-Tha'la, east of Yatta",'Palestinians — West Bank','Armed settlers attacked Palestinian homes and opened fire nearby.','SRC-2023-0302','Accepted','ILPV-2023-0219','NAD event-level monitoring; casualties/damage not specified.'),
              row('JAN23-226','2023-01-28',"Wadi Sa'ir Road",'Palestinians — West Bank','Settlers threw stones at Palestinian vehicles.','SRC-2023-0303','Accepted','ILPV-2023-0220','NAD daily/monthly event.'),
              row('JAN23-227','2023-01-28','Farsh al-Hawa Road','Palestinians — West Bank','Settlers threw stones at Palestinian vehicles north of Hebron.','SRC-2023-0304','Accepted','ILPV-2023-0221','NAD daily/monthly event.'),
              row('JAN23-228','2023-01-28','Hebron Old City','Palestinians — West Bank','Settlers fired indiscriminately and attacked Palestinian homes.','SRC-2023-0305','Accepted','ILPV-2023-0222','Timed NAD event; casualties/property damage not specified.'),
              row('JAN23-229','2023-01-28','Near Kiryat Arba, Hebron','Palestinians — West Bank','Settlers attacked Palestinian homes adjacent to Kiryat Arba.','SRC-2023-0306','Accepted','ILPV-2023-0223','Timed NAD event; specific damage/injuries not stated.'),
              row('JAN23-230','2023-01-29',"Sha'b al-Batam, Masafer Yatta",'Palestinians — West Bank','Settlers attacked a home, beat Mamdouh Abu Tabikh and family members, and grazed sheep on their crops.','SRC-2023-0307; SRC-2023-0310','Accepted','ILPV-2023-0224','NAD and WAFA independently corroborate the named-victim assault and crop damage.'),
              row('JAN23-231','2023-01-30','East of Yatta','Palestinians — West Bank','Settlers threw stones at passing Palestinian vehicles.','SRC-2023-0308','Accepted','ILPV-2023-0225','Timed NAD event; no injury/damage detail.'),
              row('JAN23-232','2023-01-31','Khirbet al-Lawza / Zuweira, east of Yatta','Palestinians — West Bank','Settlers assaulted residents, occupied Awwad-family caves and set up a bus/tents on nearby Abu Sabha land.','SRC-2023-0309','Accepted','ILPV-2023-0226','NAD gives exact time and family ownership; a monitoring digest repeats the event.'),
              row('JAN23-233','2023-01-28','Ibrahimi Mosque / Hebron Old City','Palestinians — West Bank','Monitoring says settlers attacked a number of Palestinian citizens during the Jan. 28 wave.','NAD January daily/monthly','Unresolved','','Victims, method and injury details are too vague to safely create a separate event beyond already unitized Hebron incidents.',''),
              row('JAN23-234','2023-01-13','Nabi Elias','Palestinians — West Bank','A settler-driven vehicle struck Suhaib Abd Abu Hamed, causing contusions and hospital treatment.','NAD January monthly','Rejected','','Collision documented, but available evidence does not establish intentional or politically motivated ramming.',''),
              row('JAN23-235','2023-01-15','Al-Funduq','Palestinians — West Bank','A settler-driven vehicle struck 12-year-old Hajar Fadi Basalat.','NAD January monthly','Rejected','','Collision documented, but intent is not established; excluded under the deliberate-violence rule.',''),
              row('JAN23-236','2023-01-28','Al-Auja','Palestinians — West Bank','A settler-driven vehicle struck child Saif Yasser Talib.','NAD January monitoring','Rejected','','Collision documented, but intent is not established; no political-violence classification made.',''),
              row('JAN23-237','2023-01-31','Ya’bad / Mevo Dotan area','Palestinians — West Bank','A settler-driven vehicle struck Hassan Ibrahim Hamdouni.','NAD January monitoring','Rejected','','Collision documented, but intentional ramming is not established.',''),
              row('JAN23-238','2023-01-01','Al-Jaba’a / Khallet Farwana','Palestinians — West Bank','Settlers placed a caravan on Palestinian land.','NAD January monthly','Rejected','','Land encroachment alone, without a qualifying violent act, credible threat or documented damage in this event record, is out of scope.',''),
              row('JAN23-239','2023-01-05','Al-Khader / Wadi al-Biyar','Palestinians — West Bank','Settlers planted/cultivated private Palestinian land.','NAD January monthly','Rejected','','Land encroachment alone does not establish a qualifying violence/threat/damage incident in the available record.',''),
              row('JAN23-240','2023-01-07','Al-Kaabneh / al-Zuwaidin area','Palestinians — West Bank','Settlers established a caravan/outpost while accompanying-force conduct caused separate harms.','NAD January monitoring','Rejected','','The settler act is outpost placement; available source does not separate a qualifying settler-perpetrated violent act from Israeli-force conduct.',''),
              row('JAN23-241','2023-01-16','Yatta / Masafer Yatta agricultural lands','Palestinians — West Bank','Monitoring says settlers attacked agricultural lands, without enough detail to identify the concrete act or damage.','NAD January monthly','Unresolved','','Too vague to define a distinct real-world violence/property-damage incident without over-interpreting the source.',''),
          ]

          existing_ids = {r['candidate_id'] for r in rows}
          assert not any(r['candidate_id'] in existing_ids for r in new_rows), 'New candidate IDs already exist'
          rows.extend(new_rows)
          counts = Counter(r['status'] for r in rows)
          assert len(rows) == 241, len(rows)
          assert counts['Accepted'] == 216, counts
          assert counts['Merged'] == 5, counts
          assert counts['Unresolved'] == 9, counts
          assert counts['Rejected'] == 11, counts
          assert counts['Pending'] == 0, counts

          with candidate_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          with coverage_path.open(newline='', encoding='utf-8-sig') as f:
              cr = csv.DictReader(f)
              cfields = cr.fieldnames
              coverage = list(cr)
          target = next(r for r in coverage if r['period'] == '2023-01')
          target['Palestinian / local reporting'] = 'Complete'
          target['Original social / entity searches'] = 'Complete'
          target['candidate_count'] = '241'
          target['accepted_count'] = '216'
          target['media_complete_count'] = '9'
          target['status'] = 'Complete'
          target['notes'] = ('216 accepted; 0 pending; 9 unresolved; 5 merged; 11 rejected. Final residual unitization added 31 Palestinian-target incidents across Nablus/Qalqiliya/Salfit/Bethlehem/Hebron, including named assaults, gunfire, vehicle stone attacks, home/property attacks and land/property damage. Mamdouh Abu Tabikh assault was independently corroborated by WAFA; other single-source event records remain Partially verified. Ambiguous collision-intent, vague aggregate and nonviolent land-encroachment records were rejected or preserved Unresolved rather than guessed. Israeli/civil-society lanes were already complete; exact Havat Sde Ephraim original video remains recovered but without a stable published preview. Exact media gaps remain explicit and no substitute imagery was used.')
          with coverage_path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=cfields, lineterminator='\n')
              w.writeheader(); w.writerows(coverage)
          PY

          git config user.name "historical-backfill-bot"
          git config user.email "actions@users.noreply.github.com"
          git add political-violence-media/historical-backfill/candidates/2023-01.csv political-violence-media/historical-backfill/COVERAGE.csv
          git rm .github/workflows/complete-jan23-backfill.yml
          git commit -m "Complete January 2023 historical backfill [skip ci]"
          git push
