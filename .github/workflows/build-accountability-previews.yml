name: Build accountability library previews

on:
  push:
    paths:
      - 'channel14-factcheck/manifest.json'
      - 'leadership-accountability/manifest.json'
      - '.github/workflows/build-accountability-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq poppler-utils
      - name: Build previews
        shell: bash
        run: |
          set -uo pipefail
          for root in channel14-factcheck leadership-accountability; do
            mkdir -p "$root/previews" "$root/tmp"
            manifest="$root/manifest.json"
            [ -f "$manifest" ] || continue
            while IFS= read -r item; do
              id=$(echo "$item" | jq -r '.media_id')
              type=$(echo "$item" | jq -r '.type')
              out="$root/previews/${id}.jpg"
              tmp="$root/tmp/${id}"
              echo "Processing $root / $id ($type)"

              if [ "$type" = "x" ]; then
                username=$(echo "$item" | jq -r '.username')
                status_id=$(echo "$item" | jq -r '.status_id')
                if ! json=$(curl -fsSL --retry 3 "https://api.fxtwitter.com/${username}/status/${status_id}"); then
                  echo "Could not fetch X metadata for $id; skipping" >&2
                  continue
                fi
                thumb=$(echo "$json" | jq -r '[.tweet.media.videos[]?.thumbnail_url, .tweet.media.photos[]?.url] | map(select(. != null)) | .[0] // empty')
                [ -n "$thumb" ] || { echo "No X thumbnail for $id; skipping" >&2; continue; }
                curl -fsSL --retry 3 "$thumb" -o "${tmp}.img" || continue
                ffmpeg -nostdin -y -loglevel error -i "${tmp}.img" -vf "scale='min(1400,iw)':-2" -q:v 3 "$out" || rm -f "$out"
              elif [ "$type" = "video" ]; then
                source_url=$(echo "$item" | jq -r '.source_url')
                frame_second=$(echo "$item" | jq -r '.frame_second // 1')
                ffmpeg -nostdin -y -loglevel error -ss "$frame_second" -i "$source_url" -frames:v 1 -vf "scale='min(1400,iw)':-2" -q:v 3 "$out" || rm -f "$out"
              elif [ "$type" = "image" ]; then
                source_url=$(echo "$item" | jq -r '.source_url')
                curl -fsSL --retry 3 "$source_url" -o "${tmp}.img" || continue
                ffmpeg -nostdin -y -loglevel error -i "${tmp}.img" -vf "scale='min(1400,iw)':-2" -q:v 3 "$out" || rm -f "$out"
              elif [ "$type" = "pdf" ]; then
                source_url=$(echo "$item" | jq -r '.source_url')
                page=$(echo "$item" | jq -r '.page // 1')
                if ! curl -fsSL --retry 3 "$source_url" -o "${tmp}.pdf"; then
                  echo "Could not download PDF for $id; skipping" >&2
                  continue
                fi
                if ! pdftoppm -f "$page" -singlefile -jpeg -jpegopt quality=88 -scale-to-x 1400 -scale-to-y -1 "${tmp}.pdf" "${tmp}-page" >/dev/null 2>&1; then
                  echo "Could not render PDF page for $id; skipping" >&2
                  continue
                fi
                mv "${tmp}-page.jpg" "$out"
              else
                echo "Unknown media type for $id: $type; skipping" >&2
              fi
            done < <(jq -c '.[]' "$manifest")
            rm -rf "$root/tmp"
          done
      - name: Commit previews
        run: |
          git config user.name "media-preview-bot"
          git config user.email "media-preview-bot@users.noreply.github.com"
          git add channel14-factcheck/previews leadership-accountability/previews 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Build accountability library previews"
            git pull --rebase origin main
            git push
          fi
