name: Build political violence previews

on:
  push:
    paths:
      - 'political-violence-media/manifest.json'
      - 'political-violence-media/historical-manifest.json'
      - '.github/workflows/build-political-violence-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - name: Build previews
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p political-violence-media/previews political-violence-media/tmp
          while IFS= read -r item; do
            id=$(echo "$item" | jq -r '.media_id')
            type=$(echo "$item" | jq -r '.type')
            out="political-violence-media/previews/${id}.jpg"
            tmp="political-violence-media/tmp/${id}"
            echo "Processing $id ($type)"

            if [ "$type" = "x" ]; then
              username=$(echo "$item" | jq -r '.username')
              status_id=$(echo "$item" | jq -r '.status_id')
              if ! json=$(curl -fsSL --retry 3 "https://api.fxtwitter.com/${username}/status/${status_id}"); then
                echo "Could not fetch X metadata for $id; skipping" >&2
                continue
              fi
              thumb=$(echo "$json" | jq -r '[.tweet.media.videos[]?.thumbnail_url, .tweet.media.photos[]?.url] | map(select(. != null)) | .[0] // empty')
              if [ -z "$thumb" ]; then
                echo "No thumbnail found for $id; skipping" >&2
                continue
              fi
              if ! curl -fsSL --retry 3 "$thumb" -o "${tmp}.img"; then
                echo "Could not download thumbnail for $id; skipping" >&2
                continue
              fi
              if ! ffmpeg -nostdin -y -loglevel error -i "${tmp}.img" -vf "scale='min(1400,iw)':-2" -q:v 3 "$out"; then
                echo "Could not render preview for $id; skipping" >&2
                rm -f "$out"
                continue
              fi
            elif [ "$type" = "video" ]; then
              source_url=$(echo "$item" | jq -r '.source_url')
              if ! ffmpeg -nostdin -y -loglevel error -ss 1 -i "$source_url" -frames:v 1 -vf "scale='min(1400,iw)':-2" -q:v 3 "$out"; then
                echo "Could not render video preview for $id; skipping" >&2
                rm -f "$out"
                continue
              fi
            elif [ "$type" = "image" ]; then
              source_url=$(echo "$item" | jq -r '.source_url')
              if ! curl -fsSL --retry 3 "$source_url" -o "${tmp}.img"; then
                echo "Could not download image for $id; skipping" >&2
                continue
              fi
              if ! ffmpeg -nostdin -y -loglevel error -i "${tmp}.img" -vf "scale='min(1400,iw)':-2" -q:v 3 "$out"; then
                echo "Could not render image for $id; skipping" >&2
                rm -f "$out"
                continue
              fi
            else
              echo "Unknown media type for $id: $type; skipping" >&2
              continue
            fi
          done < <(
            jq -c '.[]' political-violence-media/manifest.json
            if [ -f political-violence-media/historical-manifest.json ]; then
              jq -c '.[]' political-violence-media/historical-manifest.json
            fi
          )
          rm -rf political-violence-media/tmp
      - name: Commit previews
        run: |
          git config user.name "media-preview-bot"
          git config user.email "media-preview-bot@users.noreply.github.com"
          git add political-violence-media/previews
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Build political violence previews"
            git push
          fi
